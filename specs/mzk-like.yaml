# MZK-like corpus: structure fitted to MZK production data (calibration/findings.md).
# Only valid Kramerius data: production mistakes are not reproduced here.
# Mixes are page shares (what fraction of pages each model/profile gets), not title counts.
# Lattice p4/p2 are solved from the observed even and divisible-by-4 shares: p2- and unsnapped
# counts also land on multiples of 4 some of the time, so p4 is below the observed mod-4 share.
name: mzk-like

models:
  monograph:
    page_share: 0.79  # 60.0M of 75.9M monograph + periodical pages
    licenses:  # license sets on the root (single) or on each unit (multipart)
      dnnto+onsite: 0.585
      onsite: 0.282
      public: 0.126
      dnntt+onsite: 0.004
      mzk_public-contract: 0.002
    profiles:
      single:
        kind: single
        page_share: 0.925  # 55.6M of 60.0M monograph pages, minus leaflets
        pages: {dist: lattice_lognormal, median: 178, sigma: 0.75, p4: 0.34, p2: 0.46, minimum: 2}
      leaflet:  # the low tail a single lognormal misses: ~3% of monographs have 5-16 pages
        kind: single
        page_share: 0.002
        pages: {dist: lattice_lognormal, median: 8, sigma: 0.35, p4: 0.6, p2: 0.3, minimum: 2}
      multipart:
        kind: multipart
        page_share: 0.073  # 4.4M pages in monograph units
        units: {dist: table, weights: {1: 0.15, 2: 0.55, 3: 0.16, 4: 0.065, 5: 0.028, 6: 0.015, 7: 0.006, 8: 0.006, 10: 0.004}}
        unit_pages: {dist: lattice_lognormal, median: 292, sigma: 0.82, p4: 0.38, p2: 0.42, minimum: 2}
  periodical:
    page_share: 0.21  # 15.9M pages
    p_mixed_licenses: 0.2  # title switches license set once (older volumes first)
    licenses:  # license sets on each volume
      dnnto+onsite: 0.55
      public: 0.2
      onsite: 0.13
      dnntt+onsite: 0.12
    profiles:  # frequency classes by median issues per volume; share of periodical pages
      annual:
        page_share: 0.237
        volumes: {dist: lognormal, median: 3, sigma: 1.55}
        issues_per_volume: {nominal: 1, sigma: 0.1, p_incomplete: 0.0}
        pages_per_issue: {median: 100, sigma_between: 1.12, sigma_within: 0.51, p4: 0.48, p2: 0.4}
        p_volume_pages: 0.016
        volume_pages: {dist: lattice_lognormal, median: 6, sigma: 2.0, p4: 0.48, p2: 0.28}
        supplements_per_volume: {dist: poisson, mean: 0.0}
        supplements_per_issue: {dist: poisson, mean: 0.001}
        supplement_pages: {dist: lattice_lognormal, median: 24, sigma: 0.88, p4: 0.49, p2: 0.27}
        articles_per_issue: {dist: poisson, mean: 0.059}
        article_pages: {dist: lattice_lognormal, median: 4, sigma: 0.8, p4: 0.5, p2: 0.3}
