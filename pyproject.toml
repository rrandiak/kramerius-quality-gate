[project]
name = "kramerius-quality-gate"
version = "0.1.0"
description = "Benchmarking and validation framework for Kramerius releases, storage and infrastructure"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Robert Randiak", email = "Robert.Randiak@mzk.cz" }]
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
qg = "qg.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]
# calibration/ scripts: statistics over production dumps, not part of the qg package
calibration = [
  "numpy>=2.0",
  "pillow>=10.4",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qg"]

[tool.ruff]
target-version = "py312"
line-length = 100  # the universal house width (matches Biome)
extend-exclude = ["apps"]  # pinned upstream submodules are not this project's Python sources

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src/qg"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
